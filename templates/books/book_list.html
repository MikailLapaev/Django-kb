<!-- templates/books/book_list.html -->
{% extends 'base.html' %}

{% block title %}Мои книги{% endblock %}

{% block content %}
<div class="books-container">
    <div class="books-header">
        <h2>📖 Мои книги</h2>
        <button id="add-book-btn" class="btn btn-success">+ Добавить книгу</button>
    </div>

    <!-- Форма добавления книги -->
    <div id="add-book-form" class="form-card" style="display: none;">
        <h3>Добавить новую книгу</h3>
        <form id="book-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Название</label>
                <input type="text" id="title" name="title" required placeholder="Название книги">
            </div>
            <div class="form-group">
                <label for="author">Автор</label>
                <input type="text" id="author" name="author" required placeholder="Автор книги">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary">Отмена</button>
            </div>
        </form>
        <div id="form-error" class="error-message"></div>
    </div>

    <!-- Форма редактирования книги (НОВОЕ!) -->
    <div id="edit-book-form" class="form-card" style="display: none;">
        <h3>✏️ Редактировать книгу</h3>
        <form id="edit-form">
            {% csrf_token %}
            <input type="hidden" id="edit-book-id">
            <div class="form-group">
                <label for="edit-title">Название</label>
                <input type="text" id="edit-title" name="title" required placeholder="Название книги">
            </div>
            <div class="form-group">
                <label for="edit-author">Автор</label>
                <input type="text" id="edit-author" name="author" required placeholder="Автор книги">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Обновить</button>
                <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Отмена</button>
            </div>
        </form>
        <div id="edit-form-error" class="error-message"></div>
    </div>

    <!-- Список книг -->
    <div id="books-list" class="books-grid">
        <div class="loading">Загрузка книг...</div>
    </div>

    <div id="no-books" class="no-data" style="display: none;">
        <p>📭 У вас пока нет книг. Добавьте первую!</p>
    </div>
</div>
{% endblock %}
