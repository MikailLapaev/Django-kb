{% extends 'home.html' %}

{% block title %}Удаление книги{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠️ Подтверждение удаления</h4>
            </div>
            <div class="card-body">
                <p class="lead">Вы уверены, что хотите удалить книгу:</p>
                <h3 class="text-danger">"{{ object.title }}"</h3>
                <p class="text-muted">Это действие нельзя отменить!</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                    <a href="{% url 'book_list' %}" class="btn btn-secondary">❌ Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
