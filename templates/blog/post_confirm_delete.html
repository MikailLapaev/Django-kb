{% extends 'base.html' %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <div class="card-body" style="text-align: center; padding: 2rem;">
        <h2 style="margin-bottom: 1rem; color: #dc2626;">
            ⚠️ Удалить пост?
        </h2>
        
        <p class="text-muted mb-3">
            Вы уверены, что хотите удалить пост <strong>"{{ post.title }}"</strong>?
        </p>
        
        <p class="text-muted" style="font-size: 0.875rem; margin-bottom: 1.5rem;">
            Это действие нельзя отменить
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline">
                    Отмена
                </a>
                <button type="submit" class="btn" style="background: #dc2626; color: white;">
                    Удалить
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
