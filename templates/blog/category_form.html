{% extends 'base.html' %}

{% block title %}Новая категория{% endblock %}

{% block content %}
<h1>Создание категории</h1>

<form method="post" style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; max-width: 500px;">
    {% csrf_token %}
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Название категории</label>
        <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;" placeholder="Например: Новости, Технологии...">
    </div>
    
    <div class="flex" style="display: flex; align-items: center;">
    <button type="submit" style="padding: 10px 20px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Создать</button>
    <a href="{% url 'blog:category_list' %}" style="display: inline-block; margin-left: 10px; padding: 4px 20px; background: #6c757d; color: #fff; text-decoration: none; border-radius: 4px;">Отмена</a>
    </div>
</form>
{% endblock %}
