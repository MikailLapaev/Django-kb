{% extends 'base.html' %}

{% block title %}Удалить категорию{% endblock %}

{% block content %}
<div style="background: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 8px; max-width: 500px;">
    <h2>Удалить категорию?</h2>
    <p>Вы уверены, что хотите удалить категорию <strong>"{{ category.name }}"</strong>?</p>
    <p style="color: #dc3545; font-size: 0.9em;">⚠️ Посты в этой категории не будут удалены, но останутся без категории.</p>
    
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" style="padding: 10px 20px; background: #dc3545; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Удалить</button>
        <a href="{% url 'blog:category_list' %}" style="display: inline-block; margin-left: 10px; padding: 10px 20px; background: #6c757d; color: #fff; text-decoration: none; border-radius: 4px;">Отмена</a>
    </form>
</div>
{% endblock %}
